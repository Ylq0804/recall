<body>

<!-- ==================== 页面 1：封面 ==================== -->
<section class="page cover" id="coverPage">
  <div class="scene">
    <div class="sc-floor"></div>
    <div class="sc-shelf"></div>
    <div class="sc-board"></div>
    <div class="sc-tray"><i></i><i></i><i></i><b></b></div>

    <div class="cover-title-box">

      <h2 class="cover-sub">敢于直面残忍的抽背</h2>
    </div>
    <button class="btn-hero" id="btnEnter">抽取勇士</button>

  <div class="luxun cover-luxun" role="img" aria-label="Q版卡通鲁迅"></div>

<!-- ==================== 页面 2：抽背页 ==================== -->
<section class="page draw hidden" id="drawPage">
  <div class="stage">
    <div class="board-frame">
      <div class="blackboard" id="blackboard">

    </div>

    </div>

    <div class="controls">
      <button class="btn ctl green" id="btnStart">开始抽背</button>
      <button class="btn ctl amber" id="btnPause" disabled>暂停</button>
      <button class="btn ctl blue" id="btnResume" disabled>继续</button>
    </div>

    <div class="progress-wrap">
      <div class="progress-label"><span>本轮进度</span><span><b id="progText">0 / 62</b> 人</span></div>

  </div>

    <div class="score-card" id="scoreCard">
      <div class="score-label">实时积分</div>

        <div class="score-value" id="scoreValue">0</div>
        <div class="score-unit">分</div>
      </div>
    </div>
    <div class="wall">
      <div class="wall-head">勇士墙 <span id="wallCount">0 人</span></div>
      <div class="wall-list" id="wallList"><div class="wall-empty">本轮暂无勇士</div></div>
    </div>
  </aside>

  <div class="float-layer" id="floatLayer"></div>
  <div class="toast" id="toast"></div>
</section>

<script>
/* ===================== 学生名单（内嵌，直接使用） ===================== */
const nameList = [
  "卜亦晨","曹晨汐","曹昊然","曹天雨","曹欣宇","曹雨晨","巢鑫瑞",
  "陈家齐","陈泽魁","高文博","戈皓宇","巩宇轩","谷俊浩","侯美欣",
  "胡梓航","虎宇昂","李若浠","李誉博","刘添俊","刘悦悦","吕薪瑶",
  "马赫","马世博","马宇若","马宇轩","马雨泽","马子诺","满博涛",
  "孟婉慧","孟逸馨","潘可馨","潘昊宇","秦嘉祺","圣筱乐","史玥婷",
  "孙宝骏","孙辰惜","唐昊锐","王奥翔","王佳琦","王家乐","王凯睿",
  "王美琪","王尚","王文欣","王苡菡","王语萱","王梓峻","魏嘉禧",
  "夏若惜","徐心如","闫冰宇","张竟涵","张康琪","张珂珂","张诗韵",
  "张钰彤","赵瑞玲","赵烨涵","赵晶晶","赵子俊","祝浩宇"
];

/* ===================== 鲁迅趣味语录 ===================== */
const quotes = [
  "其实地上本没有路，走的人多了，也便成了路。",
  "不在沉默中爆发，就在沉默中灭亡。",
  "惟沉默是最高的轻蔑——但我还是要抽你。",
  "时间就像海绵里的水，只要愿挤，总还是有的。",
  "背诵这件事，我向来是认真的。",
  "哪里有天才，我是把别人喝咖啡的工夫都用在工作上的。",
  "我向来是不惮以最坏的打算来推测这道难题的。",
  "答错不可怕，可怕的是在同一个坑里摔两次。",
  "横眉冷对千夫指，俯首甘为背书人。",
  "真的勇士，敢于面对黑板，也敢于面对自己的记性。",
  "沉默呵，沉默呵，不如大声背诵出来！",
  "世上若真有捷径，那也一定叫“昨天就背了”。"
];

/* ===================== 幸运 BUFF ===================== */
const BUFFS = [
  { key: "help",   icon: "🆘", name: "求助同桌", desc: "可请同桌帮忙，答对同样 +1 分" },
  { key: "double", icon: "✨", name: "双倍积分", desc: "本次答对直接 +2 分" },
  { key: "free",   icon: "🕊️", name: "免答",     desc: "本次可以免答，不扣分" }
];
const BUFF_RATE = 0.3;   // 触发幸运 BUFF 的概率

/* ===================== 状态 ===================== */
let pool = nameList.slice();   // 本轮尚未抽到的名单
let drawn = [];                // 本轮已抽取：[{ name, result }]
let score = 0;                 // 累计积分
let state = "idle";            // idle | rolling | frozen
let rollTimer = null;
let current = null;            // 当前定格的学生
let doubleNext = false;        // 本次答对是否双倍
let lastQuote = -1;

/* ===================== DOM ===================== */
const $ = id => document.getElementById(id);
const coverPage = $("coverPage"), drawPage = $("drawPage");
const boardName = $("boardName"), boardHint = $("boardHint"), blackboard = $("blackboard");
const buffRow = $("buffRow"), scoreActions = $("scoreActions");
const scoreCard = $("scoreCard"), scoreValue = $("scoreValue");
const wallList = $("wallList"), wallCount = $("wallCount");
const progText = $("progText"), progFill = $("progFill");
const bubble = $("bubble"), floatLayer = $("floatLayer"), toastEl = $("toast");
const btnStart = $("btnStart"), btnPause = $("btnPause"), btnResume = $("btnResume");
const btnRight = $("btnRight"), btnWrong = $("btnWrong");

const esc = s => String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

/* ===================== 渲染 ===================== */
function renderWall() {
  wallCount.textContent = drawn.length + " 人";
  if (!drawn.length) { wallList.innerHTML = '<div class="wall-empty">本轮暂无勇士</div>'; return; }
  wallList.innerHTML = drawn.map(d => {
    const mark = d.result === "right" ? " ✓" : d.result === "wrong" ? " ✗" : "";
    const cls = d.result === "right" ? "right" : d.result === "wrong" ? "wrong" : "";
    return '<span class="chip ' + cls + '">' + esc(d.name) + mark + "</span>";
  }).join("");
  wallList.scrollTop = wallList.scrollHeight;
}
function renderProgress() {
  progText.textContent = drawn.length + " / " + nameList.length;
  progFill.style.width = (drawn.length / nameList.length * 100) + "%";
}
function updateButtons() {
  btnStart.disabled = state !== "idle";
  btnPause.disabled = state !== "rolling";
  btnResume.disabled = state !== "frozen";
}
function toast(msg) {
  toastEl.textContent = msg;
  toastEl.classList.add("show");
  clearTimeout(toast._t);
  toast._t = setTimeout(() => toastEl.classList.remove("show"), 2800);
}
function showFloat(text, bad) {
  const el = document.createElement("div");
  el.className = "float-text" + (bad ? " bad" : "");
  el.textContent = text;
  floatLayer.appendChild(el);
  setTimeout(() => el.remove(), 1250);
}
function setBubble() {
  let i = Math.floor(Math.random() * quotes.length);
  if (quotes.length > 1) { while (i === lastQuote) i = Math.floor(Math.random() * quotes.length); }
  lastQuote = i;
  bubble.textContent = quotes[i];
  bubble.classList.remove("pop"); void bubble.offsetWidth; bubble.classList.add("pop");
}

/* ===================== 抽背核心逻辑 ===================== */
function startRoll() {
  if (state === "frozen") clearFrozen();
  if (pool.length === 0) resetRound(true);
  if (state === "rolling") return;

  state = "rolling";
  doubleNext = false;
  current = null;
  buffRow.innerHTML = '<span class="buff-empty">幸运 BUFF 待触发…</span>';
  scoreActions.classList.add("hidden");
  boardName.classList.remove("landing");
  boardName.classList.add("rolling");
  boardHint.textContent = "名单滚动中…点击「暂停」定格勇士";
  updateButtons();

  clearInterval(rollTimer);
  rollTimer = setInterval(() => {
    boardName.textContent = pool[Math.floor(Math.random() * pool.length)];
  }, 70);
}

function freeze() {
  if (state !== "rolling") return;
  clearInterval(rollTimer); rollTimer = null;

  const idx = Math.floor(Math.random() * pool.length);
  current = pool.splice(idx, 1)[0];
  drawn.push({ name: current, result: null });

  boardName.classList.remove("rolling");
  boardName.textContent = current;
  void boardName.offsetWidth;
  boardName.classList.add("landing");
  blackboard.classList.remove("flash"); void blackboard.offsetWidth; blackboard.classList.add("flash");

  state = "frozen";
  boardHint.textContent = "请「" + current + "」作答，评委老师请打分";
  rollBuff();
  setBubble();
  renderWall();
  renderProgress();
  updateButtons();
  scoreActions.classList.remove("hidden");
}

function rollBuff() {
  if (Math.random() < BUFF_RATE) {
    const b = BUFFS[Math.floor(Math.random() * BUFFS.length)];
    if (b.key === "double") doubleNext = true;
    buffRow.innerHTML = '<span class="buff-chip">' + b.icon + " 幸运 BUFF · " + b.name + "<em>" + b.desc + "</em></span>";
  } else {
    buffRow.innerHTML = '<span class="buff-empty">本次未触发 BUFF，全凭实力作答！</span>';
  }
}

function award(correct) {
  if (state !== "frozen" || !current) return;
  const item = drawn[drawn.length - 1];
  if (item) item.result = correct ? "right" : "wrong";

  if (correct) {
    const gain = doubleNext ? 2 : 1;
    score += gain;
    doubleNext = false;
    scoreValue.textContent = score;
    scoreCard.classList.remove("bump"); void scoreCard.offsetWidth; scoreCard.classList.add("bump");
    showFloat("+" + gain + " 分", false);
    setTimeout(() => scoreCard.classList.remove("bump"), 760);
  } else {
    doubleNext = false;
    showFloat("答错", true);
  }

  scoreActions.classList.add("hidden");
  renderWall();

  if (pool.length === 0) {
    setTimeout(() => resetRound(false), 1100);
  }
}

function clearFrozen() {
  boardName.classList.remove("landing");
  scoreActions.classList.add("hidden");
  buffRow.innerHTML = '<span class="buff-empty">幸运 BUFF 待触发…</span>';
  doubleNext = false;
  current = null;
}

function resetRound(auto) {
  clearInterval(rollTimer); rollTimer = null;
  pool = nameList.slice();
  drawn = [];
  current = null;
  doubleNext = false;
  state = "idle";
  boardName.classList.remove("landing", "rolling");
  boardName.textContent = auto ? "本轮结束" : "新一轮开始";
  boardHint.textContent = "点击下方「开始抽背」，名单开始滚动";
  buffRow.innerHTML = '<span class="buff-empty">幸运 BUFF 待触发…</span>';
  scoreActions.classList.add("hidden");
  renderWall();
  renderProgress();
  updateButtons();
  toast("本轮名单已全部抽完，名单自动重置，积分继续累计！");
}

/* ===================== 事件绑定 ===================== */
$("btnEnter").addEventListener("click", () => {
  coverPage.classList.add("hidden");
  drawPage.classList.remove("hidden");
  setBubble();
  renderWall();
  renderProgress();
  updateButtons();
});

btnStart.addEventListener("click", startRoll);
btnPause.addEventListener("click", freeze);
btnResume.addEventListener("click", startRoll);
btnRight.addEventListener("click", () => award(true));
btnWrong.addEventListener("click", () => award(false));

/* 打开即用：初始化 */
renderWall();
renderProgress();
updateButtons();
progText.textContent = "0 / " + nameList.length;
</script>
</body>
</html>
